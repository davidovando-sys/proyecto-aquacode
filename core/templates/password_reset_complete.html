{% extends 'base.html' %}

{% block title %}Contraseña Actualizada - AquaCivis{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 mt-4">
                <div class="card-body p-5 text-center">
                    <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                    <h3 class="fw-bold text-aquacivis mt-3">¡Todo listo!</h3>
                    <p class="text-muted mt-3">
                        Tu contraseña ha sido actualizada correctamente. Ya puedes acceder a la plataforma.
                    </p>
                    <div class="mt-4">
                        <a href="{% url 'login' %}" class="btn btn-aquacivis rounded-pill px-5 py-2 fs-5">
                            Ir al Inicio de Sesión
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
