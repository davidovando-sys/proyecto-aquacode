{% extends 'base.html' %}

{% block title %}Iniciar Sesión - AquaCivis{% endblock %}

{% block content %}
<div class="container cuenta-page">
    <div class="row justify-content-center">
        <div class="col-12">
            
            <!-- Tarjeta de Login -->
            <div class="card cuenta-card cuenta-card-login">
                <div class="card-body cuenta-card-body">
                    
                    <div class="text-center mb-4">
                        <i class="bi bi-person-circle text-aquacivis" style="font-size: 3rem;"></i>
                        <h3 class="fw-bold text-aquacivis mt-2">Bienvenido</h3>
                        <p class="text-muted">Ingresa a tu cuenta para reportar monitoreos</p>
                    </div>

                    <!-- Formulario de Django -->
                    <form method="POST" action="" data-loading-message="Iniciando sesión...">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="username" class="form-label fw-bold text-secondary">Correo o Usuario</label>
                            <input type="text" class="form-control" id="username" name="username"
                                placeholder="ejemplo@correo.cl" value="{{ username|default:'' }}"
                                required {% if not username %}autofocus{% endif %}>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-bold text-secondary">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password"
                                placeholder="********" required {% if username %}autofocus{% endif %}>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-aquacivis rounded-pill py-2 fs-5">
                                Iniciar Sesión
                            </button>
                        </div>
                    </form>

                    <!-- Links de ayuda -->
                    <div class="text-center mt-4">
                        <p class="text-muted mb-0">¿Aún no eres parte? <a href="{% url 'solicitar_registro' %}" class="text-decoration-none text-info">Regístrate</a></p>
                        <hr class="my-4 text-muted">
                        <a href="{% url 'password_reset' %}" class="text-decoration-none text-info">¿Olvidaste tu contraseña?</a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
